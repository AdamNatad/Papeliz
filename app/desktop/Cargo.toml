[package]
name = "papeliz-desktop"
version = "0.1.0"
description = "Papeliz for the desktop: the Papeliz web app in a Tauri shell"
authors = ["Natad Corporation"]
license = "MIT"
repository = "https://github.com/AdamNatad/Papeliz"
edition = "2021"
rust-version = "1.90"

[lib]
name = "papeliz_desktop_lib"
crate-type = ["rlib"]

[features]
# A recording build only (`pnpm desktop:build:recording-devtools`): the app with DevTools, for filming
# its network calls. Off by default, so the installer, the MSIX and every update leave DevTools out.
papeliz-recording-devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-fs = "=2.7.1"
tauri-plugin-http = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-updater = "=2.14.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# Win32 for Snap Layouts on the page's maximize button and for a vault key kept in Credential Manager,
# at the version Tauri already brings in.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
