# Papeliz for Android: the key that signs release builds (the APK and the app bundle).
#
# Copy this file to papeliz-mobile-android-release-signing.properties beside it and fill in the four
# values. That copy is Git-ignored and stays on this computer; never commit it or paste it anywhere.
# Without it, release builds are left unsigned and the build signs a copy with the Android debug key
# for testing only.
#
# A build from another copy of the repository can use this one: set
# PAPELIZ_MOBILE_ANDROID_RELEASE_SIGNING_PROPERTIES_FILE to its full path.

# The keystore file, outside the repository: a full path with forward slashes, or
# ~/papeliz-release-keys/papeliz-upload.jks for your home folder. A backslash in this file starts an
# escape.
papelizAndroidReleaseKeystoreFile=

# The key's alias inside the keystore, such as papeliz-upload.
papelizAndroidReleaseKeyAlias=

# The keystore's password, and the key's own password. keytool's default keystore type (PKCS12)
# keeps one password for both, so the two are usually the same.
papelizAndroidReleaseKeystorePassword=
papelizAndroidReleaseKeyPassword=
